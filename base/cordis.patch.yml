# Operator-supplied OpenAI-compatible endpoint. All values resolve from env at
# profile load time; nothing here is a secret. Set OPENAI_BASE_URL /
# OPENAI_API_KEY / OPENAI_MODEL via the multica dashboard custom_env or
# `docker run -e`.
#
# `||` (not `??`) is used for every fallback: an empty-string env var (e.g.
# `docker run -e OPENAI_CONTEXT_WINDOW=`) must fall through to the default,
# not become `Number("") === 0`. `??` would let an empty string through.
- id: llm-pi-ai
  config:
    providers:
      openai:
        api: openai-completions
        baseURL: !!js process.env.OPENAI_BASE_URL
        apiKeyEnv: OPENAI_API_KEY
        displayName: !!js process.env.OPENAI_PROVIDER_NAME || 'OpenAI'
        models:
          - id: !!js process.env.OPENAI_MODEL || 'gpt-4o'
            name: !!js process.env.OPENAI_MODEL_NAME || process.env.OPENAI_MODEL || 'gpt-4o'
            contextWindow: !!js Number(process.env.OPENAI_CONTEXT_WINDOW || 128000)
            maxTokens: !!js Number(process.env.OPENAI_MAX_TOKENS || 16384)

# The default model selection for Agents created without an explicit model.
# dsh-base ships provider: deepseek-official / model: deepseek-flash, but that
# route's adapter is disabled below — without this override, a task that sends
# no model (multica's empty `model=""`) fails at startup with
# DSH_RUNTIME_ERROR: no adapter registered for provider "deepseek-official".
# The provider must be `openai`, the llm-pi-ai route key registered above.
- id: agent-default-model
  config:
    provider: openai
    model: !!js process.env.OPENAI_MODEL || 'gpt-4o'

# Disable DeepSeek's own API-key provider route so a missing DEEPSEEK_API_KEY
# doesn't trip the daemon's probe with an unrelated credential error. This
# image is provider-agnostic and only uses the OpenAI-compatible route above.
# (Patch row id is `llm-deepseek`; the package name is
# `@deepseek-ai/dsh-llm-deepseek-api-key`. Patch composition targets row ids,
# not package names.)
- id: llm-deepseek
  disabled: true

# Disable the DeepSeek web-search provider for the same reason: it reads
# DEEPSEEK_API_KEY which this image does not set. Without this, an agent
# attempting web search would surface a MISSING_CREDENTIAL error from a
# provider the operator never configured. The `web-fetch-http` plugin stays
# enabled, so the agent can still fetch known URLs.
- id: web-search-deepseek
  disabled: true
